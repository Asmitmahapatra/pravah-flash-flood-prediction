<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
  </defs>

  <!-- Hexagon Badge / Water Sensor Icon -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal Crest Shield -->
    <polygon points="50,0 95,25 95,75 50,100 5,75 5,25" fill="url(#shieldGrad)" stroke="#00c6ff" stroke-width="2.5" />
    
    <!-- Flowing River Waves inside Hexagon -->
    <path d="M 15 55 Q 32 40, 50 55 T 85 55" fill="none" stroke="url(#crestGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 15 68 Q 32 53, 50 68 T 85 68" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- AI Early Warning Pulse Drop -->
    <circle cx="50" cy="30" r="7" fill="#00f2fe" />
    <circle cx="50" cy="30" r="13" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- Typography -->
  <!-- "PRAVAH" Main Text -->
  <text x="125" y="65" font-family="'Segoe UI', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" letter-spacing="4" fill="#0072ff">
    PRA<tspan fill="#00c6ff">VAH</tspan>
  </text>

  <!-- Subtitle Text -->
  <text x="128" y="90" font-family="'Segoe UI', 'Roboto', 'Arial', sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#546e7a">
    FLASH-FLOOD EARLY WARNING &amp; INTELLIGENCE
  </text>
  
  <!-- Subtle Geographic Tag -->
  <rect x="128" y="98" width="145" height="4" rx="2" fill="url(#waveGrad)" />
</svg>
